name: Deploy to GitHub Pages

# DiffNote is a static, zero-build PWA — deploy the repo contents as-is.
# Only committed files are checked out, so local artifacts (.verify/, etc.)
# never reach the deployment.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the Pages deployment action.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stamp a unique service-worker cache version per deploy (the commit SHA)
      # so a new SW always activates and clients auto-reload onto the latest
      # code. Only the uploaded artifact is changed — the repo is untouched.
      - name: Stamp service worker cache version
        run: |
          sed -i "s/const CACHE_VERSION = .*/const CACHE_VERSION = 'diffnote-${{ github.sha }}';/" sw.js
          grep "CACHE_VERSION" sw.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Repo root is the site root (index.html lives here).
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
